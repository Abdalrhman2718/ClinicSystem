<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة العيادة الطبية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card">
        <h2>تسجيل دخول الكادر الطبي</h2>
        <input type="text" id="phone" placeholder="رقم الهاتف (مثال: 078xxxxxxxx)">
        <input type="password" id="password" placeholder="كلمة المرور">

        <button onclick="login()">تسجيل الدخول</button>
        <button class="secondary-btn" onclick="forgotPassword()">هل نسيت كلمة المرور؟</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
